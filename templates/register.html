{% extends 'layout.html' %}

{% block title %}Rejestracja — Rejestr zasobów{% endblock %}

{% block content %}
<h1>Utwórz konto</h1>
<form action="{% url 'register' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Utwórz konto</button>
</form>
<p>Po utworzeniu konta zaloguj się, aby przejść do aplikacji.</p>
{% endblock %}
