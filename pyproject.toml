[project]
name = "apsi-zespol2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ksokol", email = "krzysiek7171.sokol@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
    "psycopg2-binary>=2.9.13",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
